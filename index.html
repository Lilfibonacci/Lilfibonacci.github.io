  <meta name="keywords" content="Towhid Gholami, Flutter, Dart, Mobile Developer, Flutter Web, Portfolio, Cross-Platform">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Towhid Gholami | Flutter Developer">
  <meta property="og:description" content="Portfolio of Towhid Gholami - Junior Flutter Developer showcasing cross-platform mobile and web applications.">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Towhid Gholami | Flutter Developer">
  <meta property="twitter:description" content="Portfolio of Towhid Gholami - Junior Flutter Developer showcasing cross-platform mobile and web applications.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Towhid Gholami">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <link rel="manifest" href="manifest.json">

  <!-- Instant skeleton loader style (zero render-blocking external stylesheets) -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #080A14;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #15102a 0%, #080a14 75%);
      z-index: 999999;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .badge {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid rgba(124, 77, 255, 0.5);
      background: rgba(124, 77, 255, 0.1);
      color: #00E5FF;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #7C4DFF, #00E5FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 28px;
    }
    .progress-track {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 40%;
      background: linear-gradient(90deg, #7C4DFF, #00E5FF);
      border-radius: 4px;
      animation: sweep 1.4s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { left: -40%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="badge">Flutter Web • WASM</div>
    <div class="title">&lt; Portfolio /&gt;</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </div>

  <script>
    function removeSplash() {
      const splash = document.getElementById('loading-splash');
      if (splash && splash.style.opacity !== '0') {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(() => splash.remove(), 460);
      }
    }

    // Modern Flutter first frame hook
    window.addEventListener('flutter-first-frame', removeSplash);

    // Fallback observer to ensure splash is removed as soon as Flutter Canvas is mounted
    const observer = new MutationObserver((mutations, obs) => {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(removeSplash, 100);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Safety timeout in rare slow edge cases
    setTimeout(removeSplash, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
